name: PHP Lint

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Lint PHP files
        run: |
          find index.php src templates -name '*.php' -print0 | xargs -0 -n1 php -l -d error_reporting=-1
